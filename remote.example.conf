# CyberVPS remote backup configuration example
# Copy this file to remote.conf and fill in your actual values.
# NEVER commit remote.conf to Git if it contains real credentials.

# rclone remote name as configured in ~/.config/rclone/rclone.conf
CYBERBACKUP_REMOTE="myremote:CyberVPSBackup"

# Optional: direct download URL for latest backup (for HTTPS restore).
# CYBERBACKUP_URL=""

# Optional: local path to backup archive (for local restore).
# CYBERBACKUP_LOCAL=""

# If using rclone, you can also specify a configuration file explicitly:
# RCLONE_CONFIG="$HOME/.config/rclone/rclone.conf"

# Encryption for secrets backup:
# SECRETS_ENCRYPTION_RECIPIENT=""   # if using asymmetric encryption
# SECRETS_ENCRYPTION_PASSWD=""      # if using symmetric openssl
