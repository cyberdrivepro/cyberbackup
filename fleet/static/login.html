<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberVPS Fleet | Secure Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .login-container {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
    }
    .login-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-field {
      margin-bottom: 1.25rem;
    }
    .login-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
    }
    .login-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      color: var(--text-main);
      font-family: var(--font-sans);
      outline: none;
    }
    .login-input:focus {
      border-color: var(--primary);
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <div class="logo-icon" style="margin: 0 auto 0.75rem;">⚡</div>
        <div class="brand-text">CYBERVPS <span style="color: var(--primary);">FLEET</span></div>
        <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 0.25rem;">Administrator Authentication</p>
      </div>

      <div id="error-msg" class="error-banner"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="login-field">
          <label class="login-label" for="username">Username</label>
          <input type="text" id="username" class="login-input" required autofocus />
        </div>
        <div class="login-field">
          <label class="login-label" for="password">Password</label>
          <input type="password" id="password" class="login-input" required />
        </div>
        <button type="submit" id="btn-login" class="btn-primary" style="width: 100%; padding: 0.75rem;">SIGN IN</button>
      </form>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById("error-msg");
      const btn = document.getElementById("btn-login");
      errBox.style.display = "none";
      btn.disabled = true;
      btn.innerText = "AUTHENTICATING...";

      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value;

      try {
        const resp = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p }),
        });
        const data = await resp.json();
        if (resp.ok && data.ok) {
          window.location.href = "/";
        } else {
          errBox.innerText = data.detail || data.error || "Invalid username or password";
          errBox.style.display = "block";
        }
      } catch (err) {
        errBox.innerText = "Failed to connect to authentication server";
        errBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerText = "SIGN IN";
      }
    }
  </script>
</body>
</html>
